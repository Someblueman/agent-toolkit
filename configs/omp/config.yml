# Oh My Pi settings — source of truth lives in agent-toolkit.
# Installed as a symlink at ~/.omp/agent/config.yml via `scripts/install.sh omp`.
#
# Model split (mirrors the Codex usage profile: strong orchestrator, cheap workers):
#   orchestrator  gpt-5.6-sol @ high   — main session + planning (Codex subscription,
#                                       native remote compaction supported)
#   workers       glm-5.3-flash @ high / gpt-5.6-luna @ medium — subagent task role
#   explorer      deepseek-v4-flash    — fast, cheap reconnaissance subagent (agents/explorer.md)
#   auxiliary     smol = deepseek-v4-flash — titles, memory capture, auto-thinking

# Carried over from initial setup.
symbolPreset: unicode
composer:
  shape: box
colorBlindMode: true

personality: pragmatic

modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  plan: openai-codex/gpt-5.6-sol:high
  # 1M-context variant of the orchestrator for oversized sessions.
  slow: openrouter/openai/gpt-5.6-sol
  # Default subagent/worker model.
  task: opencode-go/glm-5.3-flash:high
  # Fast, cheap auxiliary model for background tasks.
  smol: opencode-go/deepseek-v4-flash
  # Reviewer model for the optional advisor.
  advisor: openai-codex/gpt-5.6-sol:medium
  # Role backing agents/explorer.md.
  explorer: opencode-go/deepseek-v4-flash

cycleOrder:
  - smol
  - default
  - task
  - slow

retry:
  modelFallback: true
  fallbackChains:
    default:
      - openrouter/openai/gpt-5.6-sol
      - opencode-go/glm-5.3-flash:high
    task:
      - openai-codex/gpt-5.6-luna:medium
      - opencode-go/glm-5.3-flash:high
      - opencode-go/deepseek-v4-flash
    smol:
      - opencode-zen/deepseek-v4-flash

# Long-autonomy sessions routinely run past one context window: promote to a
# larger model on overflow instead of compacting immediately.
contextPromotion:
  enabled: true

compaction:
  # Sessions survive multi-hour idle gaps (overnight batch launches); compact
  # during idleness instead of mid-flight.
  idleEnabled: true

memory:
  backend: local

# Capture recurring lessons to memory + managed skills after substantive turns.
autolearn:
  enabled: true
  autoContinue: false
